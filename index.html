    <title>MOTIF - Soundscape Atelier</title>
    <script>
      // set the theme before first paint (no flash of the wrong theme);
      // stored choice wins, otherwise follow the operating system
      ;(function () {
        var theme = null
        try {
          var stored = localStorage.getItem('motif:theme:v1')
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch (e) {}
        if (!theme) {
          try {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          } catch (e) {
            theme = 'dark'
          }
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>

  <body>
    <div id="root"></div>
    <noscript>MOTIF needs JavaScript. Every sound here is synthesized live in your browser.</noscript>
