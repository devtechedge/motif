<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="MOTIF, a soundscape atelier. Compose living atmospheres for focus, calm, reading and drift. Every sound is synthesized live in your browser." />
    <meta name="theme-color" content="#08090d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MOTIF - Soundscape Atelier</title>
    <script>
      // set the theme before first paint (no flash of the wrong theme)
      ;(function () {
        var theme = 'dark'
        try {
          var stored = localStorage.getItem('motif:theme:v1')
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch (e) {}
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>MOTIF needs JavaScript. Every sound here is synthesized live in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
